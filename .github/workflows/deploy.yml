name: Deploy Quartz to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write   # lets the build commit the regenerated wiki/index.md back
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Lint wiki (frontmatter, wikilinks, orphans)
        run: node scripts/lint.mjs

      # The index is a derived file. Regenerate it from page frontmatter and
      # commit it back so the repo copy is always current (Obsidian, GitHub, and
      # agents reading the repo all rely on it). [skip ci] keeps this push from
      # re-triggering the workflow. The build below uses the freshly generated
      # file regardless of whether the commit/push succeeds.
      - name: Regenerate index and commit if changed
        run: |
          node scripts/build-index.mjs
          if ! git diff --quiet -- wiki/index.md; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add wiki/index.md
            git commit -m "chore: regenerate wiki index [skip ci]"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Build site (Quartz cloned fresh, not vendored)
        run: bash scripts/build-site.sh

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
